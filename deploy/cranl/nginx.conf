# The site's own server block, for the image CranL builds from this repository.
#
# It is the container twin of tools/nginx-jadawel-site.conf, which does the same
# job for the nginx on the VPS: compression, cache lifetimes, the branded 404,
# and the previous site's URLs redirected to their new homes. Change one and
# check the other.
#
# The built site is committed — the HTML in the repository root is the
# deliverable — so the image has nothing to build, only to serve.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Redirects stay relative, so the host name in a Location header is whatever
    # the visitor asked for. Behind a CDN the origin may see a different Host
    # header than the browser did, and an absolute redirect built from it would
    # send the visitor to the origin's name instead.
    absolute_redirect off;

    # --- the previous site's URLs ----------------------------------------
    # jadawl.site used to serve /privacy, /terms, /security and the rest
    # without a file extension. Those links are in the wild, so every one of
    # them is sent to the page that replaced it rather than to a 404.
    location ~ ^/(privacy|terms|security|templates|releases|contact)/?$ {
        return 301 /$1.html;
    }
    location ~ ^/docs/?$ {
        return 301 /security.html;
    }
    location = /technical-details {
        return 301 /security.html;
    }
    location = /pricing {
        return 301 /#faq;
    }
    location = /en {
        return 301 /?lang=en;
    }
    location = /sitemap-index.xml {
        return 301 /sitemap.xml;
    }

    # --- compression ------------------------------------------------------
    # woff2 and the JPEG artwork are already compressed and are not listed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml application/rss+xml
               image/svg+xml;

    # --- HTML -------------------------------------------------------------
    # Revalidate on every request, so a deploy is visible as soon as the CDN
    # cache is purged, while a 304 still answers an unchanged request.
    location / {
        include /etc/nginx/snippets/jadawel-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # --- immutable-ish assets --------------------------------------------
    location /assets/ {
        include /etc/nginx/snippets/jadawel-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/jadawel-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/jadawel-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }

    # --- errors -----------------------------------------------------------
    error_page 404 /404.html;
    # Deliberately not `internal`: the page is previewable at /404.html, and it
    # is served with a 404 status through error_page anyway.
    location = /404.html {
        include /etc/nginx/snippets/jadawel-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
