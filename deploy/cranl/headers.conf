# Shared response headers, for the image CranL builds from this repository.
#
# nginx does not inherit `add_header` from a parent block once a child block
# declares its own, so every location includes this file instead. Same four
# headers as tools/nginx-jadawel-common.conf on the VPS; the policy matches
# what the site does — local scripts and stylesheets only, plus inline style
# attributes for a few spacing tweaks.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
