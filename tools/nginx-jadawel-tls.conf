# Jadawel website over HTTPS.
#
# The host name below is the one that resolves to this machine for the site.
# Its certificate is issued and renewed by acme.sh (HTTP-01 through the
# /.well-known/acme-challenge/ location, which this file also serves) and
# installed at /etc/nginx/certs/jadawel.azoz.cloud.{crt,key}.
#
# tools/deploy.sh installs this file only once that certificate exists: an
# ssl_certificate pointing at a missing file stops nginx from starting.
#
# The same rule as the ZenNotes vhosts applies here — a vhost whose
# ssl_certificate does not cover its server_name behaves normally over plain
# HTTP and returns nothing at all over HTTPS, because the client aborts on the
# name mismatch.

server {
	listen 80;
	listen [::]:80;
	server_name jadawel.azoz.cloud;

	# Renewal has to stay reachable on this name too, and this block answers
	# before the default server does.
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/acme;
		default_type text/plain;
		access_log off;
		try_files $uri =404;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;

	server_name jadawel.azoz.cloud;

	ssl_certificate     /etc/nginx/certs/jadawel.azoz.cloud.crt;
	ssl_certificate_key /etc/nginx/certs/jadawel.azoz.cloud.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:JadawelTLS:10m;
	ssl_session_timeout 1h;

	access_log /var/log/nginx/jadawel.access.log;
	error_log  /var/log/nginx/jadawel.error.log warn;

	include /etc/nginx/snippets/jadawel-common.conf;
	include /etc/nginx/snippets/jadawel-site.conf;
}
