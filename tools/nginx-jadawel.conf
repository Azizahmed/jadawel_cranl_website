# Jadawel website — the plain-HTTP default server.
#
# Document root is deployed by tools/deploy.sh in the source repository.
# This block replaces Alpine's stock "everything is a 404" default site and is
# the default server, so the site answers on the public IP as well as on any
# host name that resolves here, without needing DNS to be pointed at it first.
#
# HTTPS for the public host name lives in tools/nginx-jadawel-tls.conf.

server {
	listen 80 default_server;
	listen [::]:80 default_server;

	server_name srv1278373.hstgr.cloud _;

	access_log /var/log/nginx/jadawel.access.log;
	error_log  /var/log/nginx/jadawel.error.log warn;

	# --- compression and security headers ----------------------------------
	include /etc/nginx/snippets/jadawel-common.conf;

	# --- ACME renewals -----------------------------------------------------
	# acme.sh serves HTTP-01 challenges from /var/www/acme on this machine, and
	# this is the default server, so every host name that resolves here
	# validates through it. Dropping this location does not fail a deploy: it
	# breaks certificate renewal weeks later, on the next scheduled run.
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/acme;
		default_type text/plain;
		access_log off;
		try_files $uri =404;
	}

	include /etc/nginx/snippets/jadawel-site.conf;
}
