# Shared response headers for the Jadawel site.
#
# nginx does not inherit `add_header` from a parent block once a child block
# declares its own, so every location includes this snippet instead.
#
# The Content-Security-Policy matches what the site actually does: local
# scripts and stylesheets only. Inline `style` attributes are used for a few
# spacing tweaks and the mock table column widths, which is why style-src
# needs 'unsafe-inline'; there is no inline script anywhere.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
