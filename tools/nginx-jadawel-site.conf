# Shared body of the Jadawel website's server blocks.
#
# The plain-HTTP default server and the HTTPS vhost for the public host name
# both include this, so the two cannot drift apart. Installed by
# tools/deploy.sh as /etc/nginx/snippets/jadawel-site.conf.

root /var/www/jadawel;
index index.html;

charset utf-8;

# Redirects stay relative, so the host name in a Location header is whatever
# the visitor asked for. Behind a CDN the origin may see a different Host
# header than the browser did, and an absolute redirect built from it would
# send the visitor to the origin's name instead.
absolute_redirect off;

# --- the previous site's URLs --------------------------------------------
# jadawl.site served /privacy, /terms, /security and the rest without a file
# extension before this site replaced it. Those links are in the wild, so each
# one is sent to the page that took its place rather than to a 404. The same
# block lives in deploy/cranl/nginx.conf, which is what CranL serves.
location ~ ^/(privacy|terms|security|templates|releases|contact)/?$ {
	return 301 /$1.html;
}
location ~ ^/docs/?$ {
	return 301 /security.html;
}
location = /technical-details {
	return 301 /security.html;
}
location = /pricing {
	return 301 /#faq;
}
location = /en {
	return 301 /?lang=en;
}
location = /sitemap-index.xml {
	return 301 /sitemap.xml;
}

# --- compression ---------------------------------------------------------
# woff2 and the JPEG artwork are already compressed and are not listed.
gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/javascript
           application/json application/xml application/rss+xml
           image/svg+xml;

# --- HTML ----------------------------------------------------------------
# Revalidate on every request so a deploy is visible immediately, while still
# allowing a 304 when nothing changed.
location / {
	include /etc/nginx/snippets/jadawel-common.conf;
	add_header Cache-Control "no-cache";
	try_files $uri $uri/ =404;
}

# --- immutable-ish assets ------------------------------------------------
location /assets/ {
	include /etc/nginx/snippets/jadawel-common.conf;
	add_header Cache-Control "public, max-age=604800";
	access_log off;
	try_files $uri =404;
}

location = /robots.txt {
	include /etc/nginx/snippets/jadawel-common.conf;
	add_header Cache-Control "public, max-age=3600";
}
location = /sitemap.xml {
	include /etc/nginx/snippets/jadawel-common.conf;
	add_header Cache-Control "public, max-age=3600";
}

# --- errors --------------------------------------------------------------
error_page 404 /404.html;
# Deliberately not `internal`: the page is previewable and verifiable at
# /404.html, and it is served with a 404 status through error_page anyway.
location = /404.html {
	include /etc/nginx/snippets/jadawel-common.conf;
	add_header Cache-Control "no-cache";
}
