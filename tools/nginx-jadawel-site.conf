# Shared body of the Jadawel website's server blocks.
#
# The plain-HTTP default server and the HTTPS vhost for the public host name
# both include this, so the two cannot drift apart. Installed by
# tools/deploy.sh as /etc/nginx/snippets/jadawel-site.conf.

root /var/www/jadawel;
index index.html;

charset utf-8;

# --- compression ---------------------------------------------------------
# woff2 and the JPEG artwork are already compressed and are not listed.
gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/javascript
           application/json application/xml application/rss+xml
           image/svg+xml;

# --- HTML ----------------------------------------------------------------
# Revalidate on every request so a deploy is visible immediately, while still
# allowing a 304 when nothing changed.
location / {
	include /etc/nginx/snippets/jadawel-common.conf;
	add_header Cache-Control "no-cache";
	try_files $uri $uri/ =404;
}

# --- immutable-ish assets ------------------------------------------------
location /assets/ {
	include /etc/nginx/snippets/jadawel-common.conf;
	add_header Cache-Control "public, max-age=604800";
	access_log off;
	try_files $uri =404;
}

location = /robots.txt {
	include /etc/nginx/snippets/jadawel-common.conf;
	add_header Cache-Control "public, max-age=3600";
}
location = /sitemap.xml {
	include /etc/nginx/snippets/jadawel-common.conf;
	add_header Cache-Control "public, max-age=3600";
}

# --- errors --------------------------------------------------------------
error_page 404 /404.html;
# Deliberately not `internal`: the page is previewable and verifiable at
# /404.html, and it is served with a 404 status through error_page anyway.
location = /404.html {
	include /etc/nginx/snippets/jadawel-common.conf;
	add_header Cache-Control "no-cache";
}
